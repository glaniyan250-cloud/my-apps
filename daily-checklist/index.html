<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Checklist</title>
<style>
  :root{--navy:#1A2D4F;--cream:#F5F0E8;--gold:#C9A227;--ink:#1c1c1c;--muted:#6b6b6b;--card:#fff;--line:#e6e1d5;--green:#2e7d32;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--cream);color:var(--ink);padding:0 0 48px;}
  header{background:var(--navy);color:var(--cream);padding:20px 18px 16px;}
  header h1{margin:0;font-size:1.25rem;}
  header p{margin:6px 0 0;font-size:.85rem;opacity:.85;}
  .progress-wrap{padding:12px 18px 0;}
  .progress-labels{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-bottom:4px;}
  .progress{height:12px;background:#e9e4d6;border-radius:999px;overflow:hidden;}
  .progress>div{height:100%;background:linear-gradient(90deg,var(--gold),var(--green));width:0%;transition:width .3s;}
  main{padding:12px 14px;max-width:640px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 14px;margin-bottom:12px;}
  .card h2{margin:10px 0 4px;font-size:.95rem;color:var(--navy);}
  .item{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;}
  .item:last-child{border-bottom:0;}
  .box{width:26px;height:26px;min-width:26px;border:2px solid var(--navy);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:1.05rem;color:#fff;transition:background .15s;}
  .item.done .box{background:var(--green);border-color:var(--green);}
  .item .label{font-size:.92rem;line-height:1.4;}
  .item.done .label{color:var(--muted);text-decoration:line-through;}
  .item .sub{display:block;font-size:.76rem;color:var(--muted);text-decoration:none;}
  .rest{padding:12px 2px;font-size:.88rem;color:var(--muted);}
  .week{display:flex;gap:6px;margin-top:8px;}
  .day{flex:1;text-align:center;}
  .day .dname{font-size:.68rem;color:var(--muted);margin-bottom:4px;}
  .day .bar{height:34px;background:#e9e4d6;border-radius:6px;position:relative;overflow:hidden;}
  .day .bar>div{position:absolute;bottom:0;left:0;right:0;background:var(--navy);}
  .day.today .dname{color:var(--navy);font-weight:700;}
  .day .pct{font-size:.66rem;color:var(--muted);margin-top:2px;}
  .hint{font-size:.78rem;color:var(--muted);line-height:1.5;}
</style>
</head>
<body>
<header>
  <h1>Daily Checklist</h1>
  <p id="dateLine"></p>
</header>
<div class="progress-wrap">
  <div class="progress-labels"><span id="progressText">0 of 0 done</span><span id="streakText"></span></div>
  <div class="progress"><div id="progressBar"></div></div>
</div>
<main>
  <div class="card"><h2>Morning</h2><div id="group-morning"></div></div>
  <div class="card"><h2>Meals</h2><div id="group-meals"></div></div>
  <div class="card"><h2>Training &amp; movement</h2><div id="group-training"></div></div>
  <div class="card"><h2>Water</h2><div id="group-water"></div></div>
  <div class="card">
    <h2>This week</h2>
    <div class="week" id="weekStrip"></div>
    <p class="hint">Resets every morning. Gym is Mon / Wed / Fri — other days are rest.</p>
  </div>
</main>
<script>
(function(){
  "use strict";
  var LS_KEY = "daily_checklist_v1";
  var store = {};
  try{ var raw = localStorage.getItem(LS_KEY); if(raw) store = JSON.parse(raw) || {}; }catch(e){ store = {}; }
  function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(store)); }catch(e){} }
  function dayKey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  var today = new Date();
  var key = dayKey(today);
  if(!store[key]) store[key] = {};
  var state = store[key];

  var GYM_DAYS = [1,3,5]; // Mon, Wed, Fri
  var isGymDay = GYM_DAYS.indexOf(today.getDay()) >= 0;

  var ITEMS = [
    {id:"weighin", group:"morning", label:"Morning weigh-in", sub:"Same time daily — log it in the Cut Tracker"},
    {id:"breakfast", group:"meals", label:"Breakfast", sub:"3 fried eggs + 300g egg whites + 2 protein bread"},
    {id:"lunch", group:"meals", label:"Lunch", sub:"175g salmon + 150g rice + salad + salad cream"},
    {id:"snack", group:"meals", label:"Snack", sub:"1 scoop whey + 250ml protein milk"},
    {id:"dinner", group:"meals", label:"Dinner", sub:"175g salmon + 125g rice + mixed veg"},
    {id:"creatine", group:"meals", label:"Creatine 5g", sub:"Any time, with water"},
    {id:"steps", group:"training", label:"8,000–10,000 steps", sub:"Walk it off — store laps count"},
    {id:"water1", group:"water", label:"1 litre"},
    {id:"water2", group:"water", label:"2 litres"},
    {id:"water3", group:"water", sub:"", label:"3 litres"},
    {id:"water4", group:"water", label:"4 litres"}
  ];
  if(isGymDay){
    ITEMS.splice(7, 0, {id:"gym", group:"training", label:"Gym session", sub:"Training day — Mon / Wed / Fri"});
  }

  var NAMES = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  document.getElementById("dateLine").textContent =
    NAMES[today.getDay()]+", "+MONTHS[today.getMonth()]+" "+today.getDate()+(isGymDay ? " · Gym day" : " · Rest day");

  function render(){
    ["morning","meals","training","water"].forEach(function(g){
      var el = document.getElementById("group-"+g);
      el.innerHTML = "";
      ITEMS.filter(function(i){return i.group===g;}).forEach(function(item){
        var div = document.createElement("div");
        div.className = "item" + (state[item.id] ? " done" : "");
        div.innerHTML = '<div class="box">'+(state[item.id] ? "✓" : "")+'</div>'+
          '<div class="label">'+item.label+(item.sub ? '<span class="sub">'+item.sub+'</span>' : '')+'</div>';
        div.onclick = function(){
          state[item.id] = !state[item.id];
          save(); render();
        };
        el.appendChild(div);
      });
    });
    if(!isGymDay){
      var el = document.getElementById("group-training");
      var rest = document.createElement("div");
      rest.className = "rest";
      rest.textContent = "Rest day — no gym. Steps and water still count.";
      el.insertBefore(rest, el.firstChild);
    }
    var done = ITEMS.filter(function(i){return state[i.id];}).length;
    var pct = ITEMS.length ? Math.round(done/ITEMS.length*100) : 0;
    document.getElementById("progressBar").style.width = pct+"%";
    document.getElementById("progressText").textContent = done+" of "+ITEMS.length+" done";
    renderWeek();
  }

  function dayPct(dkey){
    var s = store[dkey] || {};
    // reconstruct item count for that date (gym days have 12, rest 11)
    var d = new Date(dkey+"T12:00:00");
    var n = GYM_DAYS.indexOf(d.getDay()) >= 0 ? 12 : 11;
    var ids = ["weighin","breakfast","lunch","snack","dinner","creatine","steps","water1","water2","water3","water4"];
    if(n === 12) ids.push("gym");
    var done = ids.filter(function(id){return s[id];}).length;
    return Math.round(done/n*100);
  }

  function renderWeek(){
    var strip = document.getElementById("weekStrip");
    strip.innerHTML = "";
    for(var i=6;i>=0;i--){
      var d = new Date(today); d.setDate(d.getDate()-i);
      var dk = dayKey(d);
      var pct = (dk === key) ? Math.round(ITEMS.filter(function(x){return state[x.id];}).length/ITEMS.length*100) : dayPct(dk);
      var col = document.createElement("div");
      col.className = "day" + (dk === key ? " today" : "");
      col.innerHTML = '<div class="dname">'+NAMES[d.getDay()]+'</div>'+
        '<div class="bar"><div style="height:'+pct+'%"></div></div>'+
        '<div class="pct">'+pct+'%</div>';
      strip.appendChild(col);
    }
  }

  render();
})();
</script>
</body>
</html>
